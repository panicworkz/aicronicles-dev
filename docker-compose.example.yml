services:
  panic-postgres:
    image: postgres:16-alpine
    container_name: panic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panic_pass}
      POSTGRES_DB: ${POSTGRES_DB:-panic_cms}
    volumes:
      - /opt/panic/postgres_data:/var/lib/postgresql/data
    networks:
      - panic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panic} -d ${POSTGRES_DB:-panic_cms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  panic-cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panic-cms
    restart: unless-stopped
    ports:
      - "127.0.0.1:8230:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-panic}:${POSTGRES_PASSWORD:-panic_pass}@panic-postgres:5432/${POSTGRES_DB:-panic_cms}}
      JWT_SECRET: ${JWT_SECRET}
      MEDIA_DIR: /opt/panic/media
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://fabelo.testworkz.com}
      NEXT_PUBLIC_SITE_DOMAIN: ${NEXT_PUBLIC_SITE_DOMAIN:-fabelo.testworkz.com}
    volumes:
      - /opt/panic/media:/opt/panic/media
    networks:
      - panic-net
    depends_on:
      panic-postgres:
        condition: service_healthy

networks:
  panic-net:
    driver: bridge
