# =====================================================================
# panic.panic.pw — STAGE
#
# fabelo.io'nun aynisi, ama:
#   - AYRI veritabani ve medya (icerik denemeleri canliya sizmiyor)
#   - ARAMA MOTORLARINA TAMAMEN KAPALI (asagi bkz.)
#   - ONBELLEK YOK: burada yayinladigin seyi hemen gormen gerekiyor,
#     canlidaki 60 saniyelik proxy_cache burada ise yaramaz, yanlis
#     "degismedi" izlenimi verir.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name panic.panic.pw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panic.panic.pw;

    ssl_certificate     /etc/letsencrypt/live/panic.panic.pw-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panic.panic.pw-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- ARAMA MOTORLARINA KAPALI ---------------------------------
    # Uc katmanli, cunku birini atlamak yeter:
    #   1. robots.txt        tarayiciya "girme" der
    #   2. X-Robots-Tag      girse bile "dizine koyma" der
    #   3. always            hata sayfalarinda da basilir
    # Uygulamanin kendi meta etiketlerine GUVENMIYORUZ: fabelo.io ile
    # ayni kodu calistiriyor ve orada sayfalar index'e acik.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Canlinin site haritasi stage'den duyurulmasin.
    location = /sitemap.xml      { return 404; }
    location = /sitemap-news.xml { return 404; }

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8231;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Onbellek YOK — bkz. dosyanin basi.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }
}
